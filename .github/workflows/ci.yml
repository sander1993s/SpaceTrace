name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and package
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up Rust stable for Windows x64
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal

      - name: Install JavaScript dependencies
        run: npm ci --include=dev

      - name: Build interface, run locked Rust tests, and package installer
        run: ./scripts/build-windows.ps1
