[package]
name = "spacetrace-scanner"
version = "0.1.0"
edition = "2021"
description = "Read-only streaming filesystem scanner for SpaceTrace"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "spacetrace-scan"
path = "src/main.rs"
